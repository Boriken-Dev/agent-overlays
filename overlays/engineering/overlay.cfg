name = "engineering"
description = "Opinionated engineering process, always-on: the discipline rules (commit shape, release-tag consent, benchmark evidence, token discipline, draft follow-ups), the plan/execute/review/repo workflows, model-selection guidance, language-neutral repo templates (README, CHANGELOG, LICENSE, .gitignore, docs-index, the plan template), and the skills/scripts `plans`, `decisions`, `records`, `leak-check`, `blob-scan`, `context-check`, `eol`, `summarize-run`, `compare-bench`, `build-slot`, `gate`, `merge`, `worktrees` and `configure-pages`."
requires = []
routing = [
  """- Query, update, edit, move or remove any frontmatter-Markdown folder (`plans/`, `findings/`, `decisions/`, ...) → the `records` skill / script (`$ENGINEERING_OVERLAY_ROOT/skills/records/records.py`: `query`, `show`, `add`, `set`, `edit`, `mv`, `rm`, `providers`)""",
  """- Record, query, decide, supersede or migrate architectural decisions → the `decisions` skill / script (`$ENGINEERING_OVERLAY_ROOT/skills/decisions/decisions.py`: `add`, `list`, `query`, `show`, `set`, `edit`, `decide`, `supersede`, `migrate`)""",
  """- Write or revise a plan → `plans add` / `plans edit`, as $ENGINEERING_OVERLAY_ROOT/flows/PLAN.md says""",
  """- Execute a plan → $ENGINEERING_OVERLAY_ROOT/flows/EXEC.md""",
  """- Create, read, step, query or move a plan → the `plans` skill / script (`$ENGINEERING_OVERLAY_ROOT/skills/plans/plans.py`: `add`, `list`, `query`, `next`,
  `start`, `check -m`, `block -m`, `note -m`, `status`, `validate`); never hand-edit a
  progress box or read a whole plan for one section""",
  """- Assign a model to a plan / delegate to a subagent / judge if a task is worth an
  expensive model → $ENGINEERING_OVERLAY_ROOT/kb/MODELS.md""",
  """- Multi-architect plan review (as main or reviewer) → $ENGINEERING_OVERLAY_ROOT/flows/REVIEW.md""",
  """- Several agents on one repository, worktrees, integrating or cleaning up after
  them → $ENGINEERING_OVERLAY_ROOT/flows/PARALLEL.md""",
  """- Line endings: check, convert, or exempt a file → the `eol` skill / script (`eol check|fix`,
  $ENGINEERING_OVERLAY_ROOT/kb/EOL.md)""",
  """- Create a repo, bring one to standard, or touch CI/release/docs-site →
  $ENGINEERING_OVERLAY_ROOT/flows/REPO.md""",
  """- Write or review comments, docstrings, log or error messages →
  $ENGINEERING_OVERLAY_ROOT/kb/COMMENTS.md""",
  """- Before a handoff, a push to a public remote or a release tag: the leak scan →
  the `leak-check` skill / script (`leak-check <repo>`,
  $ENGINEERING_OVERLAY_ROOT/kb/LEAKS.md); the whole history of several repositories → `leak-check-history`; what a
  malware or archive scanner would refuse in any ref (archives, executables, keys, packs, opaque binaries) → the `blob-scan` skill /
  script (`blob-scan <repo>`)""",
  """- Where a project keeps its agent context (`AGENTS.md` and `AGENTS.*.md` in a directory and its `.agents`, `AGENTS_DIR`
  and `AGENTS_CONTEXT`), and a check that nothing else is committed in its place (`CLAUDE.md`, `GEMINI.md`, ...) → the
  `context-check` skill / script (`context-check [repo]`), the "Meta files" section of $ENGINEERING_OVERLAY_ROOT/flows/REPO.md""",
  """- Deep review of a whole repository (goals, standards, soundness, lean code;
  records findings, plans on request) → the `repo-review` skill,
  $ENGINEERING_OVERLAY_ROOT/skills/repo-review/SKILL.md""",
  """- Run a noisy build/test/lint command → the `summarize-run` skill / script (`summarize-run -- <cmd>`:
  verdict + the lines that matter, full log on disk); compare benchmark JSONs →
  the `compare-bench` skill / script (`compare-bench <old.json> <new.json>`)""",
  """- Heavy builds, gates, conflict resolution or worktree clean-up → the `build-slot`, `gate`, `merge` and `worktrees` skills / scripts
  (`$ENGINEERING_OVERLAY_ROOT/kb/AGENT_TOOLS.md`); set up a repository's GitHub Pages settings →
  the `configure-pages` skill / script (`configure-pages OWNER/REPO`)""",
]

# rules/ENGINEERING.md holds its always-on rules by default: `overlays add` merges
# the file's leading `- **...` bullet run into AGENTS.md's managed block; prose from
# its first `## ` heading down stays out.

# Its commands (leak-check, eol) run git.
[runtime]
commands = ["git"]

[scripts]
plans = "skills/plans/plans.py"
records = "skills/records/records.py"
decisions = "skills/decisions/decisions.py"
leak-check = "skills/leak-check/leak_check.py"
leak-check-history = "skills/leak-check/leak_check_history.py"
blob-scan = "skills/blob-scan/blob_scan.py"
context-check = "skills/context-check/context_check.py"
eol = "skills/eol/eol.py"
summarize-run = "skills/summarize-run/summarize_run.py"
compare-bench = "skills/compare-bench/compare_bench.py"
build-slot = "skills/build-slot/build_slot.py"
gate = "skills/gate/gate.py"
merge = "skills/merge/merge.py"
worktrees = "skills/worktrees/worktrees.py"
configure-pages = "skills/configure-pages/configure_pages.py"

# What a store shows; nothing here changes what the overlay does.
[about]
summary = "Process rules, plan and review workflows, and repository templates for agent-run engineering."
icon = "icon.png"
homepage = "https://github.com/Boriken-Dev/agent-overlays/tree/main/overlays/engineering"
repository = "https://github.com/Boriken-Dev/agent-overlays"
license = "MIT"
tags = ["workflow", "process"]
