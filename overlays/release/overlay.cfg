name = "release"
description = "VCS-host-agnostic release helper: agent-driven commit-plan loop (emit context → apply per-commit) plus tag + CI monitoring across GitHub (gh CLI) and GitLab (gitlabq). The command repo-guard commits and pushes under one identity with no agent attribution, refreshes a deps branch and runs CI once. Also repo/tools/: the shared build.py, public_api.py and apk.py a repository copies into its tools/."
requires = ["engineering"]
routing = [
  """- Cut a release, build/apply a per-commit plan, or monitor CI after a release
  tag (GitHub or GitLab) → $RELEASE_OVERLAY_ROOT/kb/RELEASE.md""",
  """- Vendor a repo's crates onto a `deps` branch, check an SDK lock, build offline or
  release binaries, or copy/update `tools/build.py` → $RELEASE_OVERLAY_ROOT/kb/BUILD.md""",
  """- Commit or push to a repository's main, refresh its deps branch, or run CI once → `repo-guard`
  ($RELEASE_OVERLAY_ROOT/kb/RELEASE.md, \"repo-guard\")""",
]

# Tags and commits are git; gh or gitlabq is the host's and stays optional.
[runtime]
commands = ["git"]

# repo-guard imports the engineering overlay's lib/python/agent_tools.py, so that overlay is required.
# The launcher is named with a hyphen; the discovered `repo_guard` one is dropped.
[scripts]
repo-guard = "bin/repo_guard.py"
repo_guard = false

# What a store shows; nothing here changes what the overlay does.
[about]
summary = "Cut releases and watch their CI, on GitHub or GitLab, with a commit plan the agent applies."
icon = "icon.png"
homepage = "https://github.com/Boriken-Dev/agent-overlays/tree/main/overlays/release"
repository = "https://github.com/Boriken-Dev/agent-overlays"
license = "MIT"
tags = ["release", "workflow"]
