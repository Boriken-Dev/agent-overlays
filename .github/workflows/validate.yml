name: Validate

# Started by hand: it reads every overlay and the catalog with coqui-aos, and
# checks that the committed icons are the ones tools/make_icons.py draws.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to validate (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the reader
        run: pip install "coqui-aos @ git+https://github.com/Boriken-Dev/coqui-aos#subdirectory=python"
      - name: Validate every overlay and the catalog
        run: python tools/validate.py
      - name: Icons match their generator
        run: python tools/make_icons.py --check
